apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: failurepredictors.preface.example.com
spec:
  group: preface.example.com
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                threshold:
                  type: object
                  properties:
                    risk:
                      type: number
                debounce:
                  type: object
                  properties:
                    ticks:
                      type: integer
                cooldown:
                  type: object
                  properties:
                    seconds:
                      type: integer
                actions:
                  type: object
                  properties:
                    reschedule:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                    restart:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                    scale:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                policy:
                  type: object
                  properties:
                    shadowMode:
                      type: boolean
            status:
              type: object
              properties:
                risk:
                  type: object
                  properties:
                    current:
                      type: number
                    criticalProbability:
                      type: number
                rootCause:
                  type: object
                  properties:
                    service:
                      type: string
                decision:
                  type: object
                  properties:
                    selectedAction:
                      type: string
                    deltaEu:
                      type: number
                    interventionEligible:
                      type: boolean
                persistence:
                  type: object
                  properties:
                    currentTicks:
                      type: integer
                    requiredTicks:
                      type: integer
                safety:
                  type: object
                  properties:
                    shadowMode:
                      type: boolean
                    cooldownRemaining:
                      type: number
                    rateLimitState:
                      type: integer
                health:
                  type: object
                  properties:
                    lastSuccessfulTick:
                      type: number
                    lastError:
                      type: string
                    inferenceLatency:
                      type: number
                recentActions:
                  type: array
                  items:
                    type: string
                checkpoint:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
  scope: Namespaced
  names:
    plural: failurepredictors
    singular: failurepredictor
    kind: FailurePredictor
    shortNames:
      - fp
